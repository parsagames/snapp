name: Build Persian TTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Sherpa-ONNX Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 5 --retry-delay 2 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          ls -lh app/libs/sherpa-onnx-1.13.8.aar

      - name: Download Persian TTS model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tts
          curl -fL --retry 5 --retry-delay 2 \
            -o /tmp/vits-piper-fa_IR-amir-medium.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fa_IR-amir-medium.tar.bz2
          tar -xjf /tmp/vits-piper-fa_IR-amir-medium.tar.bz2 -C app/src/main/assets/tts
          test -f app/src/main/assets/tts/vits-piper-fa_IR-amir-medium/fa_IR-amir-medium.onnx
          test -f app/src/main/assets/tts/vits-piper-fa_IR-amir-medium/tokens.txt
          test -d app/src/main/assets/tts/vits-piper-fa_IR-amir-medium/espeak-ng-data
          echo "Persian TTS model files:"
          find app/src/main/assets/tts/vits-piper-fa_IR-amir-medium -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snappbox-persian-tts-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
